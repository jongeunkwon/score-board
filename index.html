  :root{
    --ink:#0A0A0B;
    --paper:#F2F3EF;
    --mute:#7C808F;
    --line:#26262B;
    --c1:#D9FB4B;
    --c2:#1547F7;
    --c3:#E840F0;
    --c4:#80FBF4;
    /* 팀 색 — 팀세팅 파일 「팀배정」 프레임에서 뽑은 값 */
    --tA:#FFD9DB; --tB:#FFDA9F; --tC:#FCFFC5;
    --tD:#D1FFB1; --tE:#B1D3FF; --tF:#E6C9FF;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    /* 내장 서브셋에 없는 글자는 시스템 한글 폰트로 떨어진다 — 두부 방지 */
    font-family:"Noto Sans KR","Roboto Flex","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .wrap{
    height:100%;
    max-width:1600px;
    margin:0 auto;
    padding:16px;
    padding-block:20px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px 28px;
    flex-wrap:wrap;
  }

  /* ── head ── */
  .eyebrow{
    font-family:"Roboto Flex",sans-serif;
    font-variation-settings:'wdth' 62,'wght' 700;
    font-size:.72rem;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--mute);
    margin:0;
  }
  h1{
    font-family:"Roboto Flex",sans-serif;
    font-variation-settings:'wdth' 145,'wght' 900,'opsz' 144;
    font-size:clamp(1.9rem,5.4vh,3.4rem);
    line-height:.9;
    letter-spacing:-.02em;
    margin:.12em 0 0;
    white-space:nowrap;
  }
  h1 em{font-style:normal;color:var(--c1)}

  /* ── 상단 조작 ── */
  .setup{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px}
  .field{
    display:flex;align-items:center;gap:8px;
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:4px 8px 4px 18px;
  }
  .field label{
    font-family:"Roboto Flex",sans-serif;
    font-variation-settings:'wdth' 62,'wght' 700;
    font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);
  }
  .rnum{
    font-family:"Roboto Flex",sans-serif;
    font-variation-settings:'wdth' 100,'wght' 800;
    font-variant-numeric:tabular-nums;
    font-size:20px;min-width:1.4em;text-align:center;
  }
  .rnav{
    width:32px;height:32px;padding:0;
    border-radius:999px;border:1.5px solid var(--line);
    background:transparent;color:var(--paper);
    font-size:18px;line-height:1;cursor:pointer;transition:.15s;
  }
  .rnav:hover:not(:disabled){border-color:var(--c1);color:var(--c1)}
  .rnav:disabled{opacity:.3;cursor:default}
  input[type=number]{
    width:2.7em;
    background:transparent;border:0;color:var(--paper);
    font-family:"Roboto Flex",sans-serif;
    font-variation-settings:'wdth' 100,'wght' 800;
    font-variant-numeric:tabular-nums;
    font-size:20px;text-align:right;
    padding:4px 6px;
  }
  input[type=number]:focus{outline:2px solid var(--c4);outline-offset:2px;border-radius:8px}
  .preset{
    font-family:"Roboto Flex",sans-serif;
    font-variation-settings:'wdth' 85,'wght' 700;
    font-size:15px;
    padding:9px 16px;border-radius:999px;
    border:1.5px solid var(--line);background:transparent;color:var(--mute);
    cursor:pointer;transition:.15s;
  }
  .preset:hover,.preset[aria-pressed=true]{border-color:var(--c1);color:var(--c1)}

  .netbadge{
    font-family:"Roboto Flex",sans-serif;
    font-variation-settings:'wdth' 62,'wght' 700;
    font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
    padding:9px 16px;border-radius:999px;
    border:1.5px solid var(--c4);color:var(--c4);
  }
  .netbadge.off{border-color:var(--c3);color:var(--c3)}

  /* ── board ── */
  .board{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);
    gap:12px;
  }
  .slot{
    position:relative;
    min-height:0;
    border:1.5px solid var(--line);
    border-radius:20px;
    background:#1212150F;
    padding:clamp(12px,2vh,20px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(6px,1.2vh,12px);
    overflow:hidden;
    transition:border-color .25s,background .25s;
  }
  .slot.lead{
    border-color:var(--team);
    background:var(--team);
    animation:pop .34s cubic-bezier(.2,1.5,.4,1);
  }
  @keyframes pop{0%{transform:scale(.96)}100%{transform:scale(1)}}

  .ord{
    position:absolute;
    top:14px; left:16px;
    font-family:"Roboto Flex",sans-serif;
    font-variation-settings:'wdth' 70,'wght' 700;
    font-variant-numeric:tabular-nums;
    font-size:.78rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--mute);
    transition:color .25s;
  }
  .slot.lead .ord{color:#0A0A0B99}
  .tid{
    position:absolute;
    top:10px; right:16px;
    font-family:"Roboto Flex",sans-serif;
    font-variation-settings:'wdth' 151,'wght' 900,'opsz' 144;
    font-size:clamp(1.3rem,4vh,2.4rem);
    line-height:1;
    color:var(--team);
    transition:color .25s;
  }

  .score{
    font-family:"Roboto Flex",sans-serif;
    font-variation-settings:'wdth' 151,'wght' 900,'opsz' 144;
    font-variant-numeric:tabular-nums;
    font-size:min(17vh,10vw);
    line-height:.86;
    letter-spacing:-.02em;
    color:var(--paper);
    transition:color .25s;
  }
  .slot.lead .tid,
  .slot.lead .score{color:var(--ink)}
  .score.bump{animation:bump .34s cubic-bezier(.2,1.5,.4,1)}
  @keyframes bump{0%{transform:scale(1.16)}100%{transform:scale(1)}}

  .vlabel{
    font-family:"Roboto Flex",sans-serif;
    font-variation-settings:'wdth' 62,'wght' 700;
    font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--mute);
  }
  .slot.lead .vlabel{color:#0A0A0B99}
  .rounds{
    display:flex;flex-wrap:wrap;justify-content:center;gap:5px;
    max-height:4.6em;overflow:hidden;
  }
  .chip{
    font-family:"Roboto Flex",sans-serif;
    font-variation-settings:'wdth' 70,'wght' 700;
    font-variant-numeric:tabular-nums;
    font-size:.7rem;letter-spacing:.06em;
    padding:2px 9px;border-radius:999px;
    border:1px solid var(--line);color:var(--mute);
    transition:.15s;
  }
  .chip.now{border-color:var(--c4);color:var(--c4)}
  /* 1위 카드는 바탕이 밝으므로 안쪽 요소를 검정 계열로 뒤집는다 */
  .slot.lead .chip{border-color:#0A0A0B33;color:#0A0A0B99}
  .slot.lead .chip.now{border-color:var(--ink);color:var(--ink)}

  /* 입력 모드에서만 나온다 — 표시 전용일 때 화면을 깨끗하게 둔다 */
  .ctl{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1vh,10px)}
  .ctl button{

<script>
/* ──────────── 설정 ────────────
   팀 이름이 정해지면 여기만 고치면 된다. 개수도 자유. */
const TEAMS = ["A","B","C","D","E","F"];
/* 팀 색 — TEAMS 와 순서를 맞춘다. 팀세팅 파일 「팀배정」 프레임 값 */
const TEAM_COLORS = ["#FFD9DB","#FFDA9F","#FCFFC5","#D1FFB1","#B1D3FF","#E6C9FF"];
const SAVE_KEY = "nhn-workshop-scoreboard-v1";

/* ──────────── 상태 ──────────── */
let rounds = [TEAMS.map(() => 0)];   // rounds[라운드][팀] = 그 라운드 점수
let cur = 0;                          // 지금 입력 중인 라운드 (0부터)
let history = [];                     // 되돌리기 — {r, t, d}
let vals = [1, 3, 5];                 // 카드에 달리는 버튼 값 — 상단에서 고친다
let view = "round";                   // 큰 숫자가 무엇인가 — "round" 이번 라운드 / "total" 합계
let sound = true;

/* ──────────── 구글 시트 따라가기 ────────────
   주소 끝에 ?sheet=<시트ID> 를 붙이면 그 시트를 1.5초마다 읽어 화면에 옮긴다.
   시트가 정본이므로 이 화면에서는 점수를 고치지 않는다.
   구글이 CORS 를 막는 경우가 있어 script 태그로 받아온다(JSONP). */
const SHEET = new URLSearchParams(location.search).get("sheet");
let sheetSeq = 0;

function sheetUrl(){
  const cb = "__sheetData" + (++sheetSeq);
  const u = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(SHEET) +
            "/gviz/tq?tqx=out:json;responseHandler:" + cb + "&t=" + Date.now();
  return {url: u, cb};
}
function fetchSheet(){
  return new Promise((resolve, reject) => {
    const {url, cb} = sheetUrl();
    const el = document.createElement("script");
    const done = ok => { delete window[cb]; el.remove(); };
    const timer = setTimeout(() => { done(); reject(new Error("timeout")); }, 8000);
    window[cb] = data => { clearTimeout(timer); done(); resolve(data); };
    el.onerror = () => { clearTimeout(timer); done(); reject(new Error("load")); };
    el.src = url;
    document.head.appendChild(el);
  });
}
const cellNum = c => {
  if(!c) return 0;
  const v = c.v;
  if(typeof v === "number") return v;
  const n = parseFloat(String(v == null ? "" : v).replace(/[^0-9.\-]/g, ""));
  return isNaN(n) ? 0 : n;
};
function readSheet(data){
  // 표가 시트 어디에 있어도 찾는다. 이름이 붙은 열만 골라내고,
  // 그중 첫째를 라운드 이름 열, 나머지를 팀 열로 본다.
  const t = data.table;
  let used = [];
  t.cols.forEach((c, i) => { if((c && c.label || "").trim()) used.push(i); });
  if(used.length < 2) used = t.cols.map((_, i) => i);   // 머리글이 없으면 순서대로
  const roundCol = used[0];
  const teamCols = used.slice(1, 1 + TEAMS.length);
  const names = teamCols.map(i => (t.cols[i].label || "").trim());

  const rows = [];
  (t.rows || []).forEach(r => {
    const c = r.c || [];
    const vals = teamCols.map(i => cellNum(c[i]));
    const rl = c[roundCol];
    const named = rl != null && rl.v != null && String(rl.v).trim() !== "";
    if(named || vals.some(v => v !== 0)) rows.push(vals);
  });
  return {names: names.filter(Boolean), rows};
}
function applySheet(d){
  if(!d.rows.length) return;
  if(d.names.length === d.rows[0].length){
    for(let i = 0; i < TEAMS.length && i < d.names.length; i++){
      if(d.names[i] && TEAMS[i] !== d.names[i]){
        TEAMS[i] = d.names[i];
        slots[i].querySelector(".tid").textContent = d.names[i];
      }
    }
  }
  rounds = d.rows.map(r => {
    const row = TEAMS.map((_, i) => r[i] || 0);
    return row;
  });
  // 값이 들어간 마지막 행을 지금 라운드로 본다
  let last = rounds.length - 1;
  while(last > 0 && rounds[last].every(v => v === 0)) last--;
  cur = last;
  render();
}
async function sheetPoll(){
  try{
    applySheet(readSheet(await fetchSheet()));
    setNet("sheet");
  }catch(e){
    setNet("offline");
  }
  setTimeout(sheetPoll, 1500);
}

/* ──────────── 다른 노트북과 맞추기 ────────────
   server.py 가 떠 있으면 그쪽이 정본이 된다.
   파일로 직접 열었거나 서버가 없으면 이 브라우저에만 저장한다. */
let net = "local";        // local | server | offline
let ver = -1;
let queue = [];           // 서버가 잠깐 끊겼을 때 쌓아뒀다 다시 보낸다

function setNet(v){
  net = v;
  const b = document.getElementById("net");
  if(v === "local"){ b.hidden = true; return; }
  b.hidden = false;
  b.textContent = v === "sheet" ? "시트 연결" : v === "server" ? "연결됨" : "연결 끊김";
  b.classList.toggle("off", v === "offline");
}
function applyState(s, bumped){
  rounds = s.rounds; cur = s.cur; vals = s.vals;
  vins.forEach(i => { if(document.activeElement !== i) i.value = vals[+i.dataset.i]; });
  render(bumped);
}
async function post(op){
  const r = await fetch("op", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(op)
  });
  if(!r.ok) throw new Error("bad response");
  return r.json();
}
let flushing = false;
async function flush(){
  // 연속으로 누르면 전송 루프가 겹쳐 돌아 같은 조작이 두 번 올라간다
  if(flushing) return;
  flushing = true;
  try{
    while(queue.length){
      const {op, bumped} = queue[0];
      const s = await post(op);
      ver = s.v;
      applyState(s, bumped);
      queue.shift();
    }
  }finally{
    flushing = false;
  }
}
function sendOp(op, bumped){
  queue.push({op, bumped});
  flush().then(() => setNet("server")).catch(() => setNet("offline"));
}
async function poll(){
  if(net !== "local"){
    try{
      if(queue.length){
        await flush();
      }else{
        const r = await fetch("state", {cache: "no-store"});
        const s = await r.json();
        if(s.v !== ver){ ver = s.v; applyState(s); }
      }
      setNet("server");
    }catch(e){ setNet("offline"); }
  }
  setTimeout(poll, 600);
}

/* ──────────── 저장 ──────────── */
function save(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({rounds, cur, history, vals, view}));
  }catch(e){ /* 사파리 비공개 모드 등 — 저장만 못 할 뿐 화면은 돈다 */ }
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!Array.isArray(d.rounds) || !d.rounds.length) return;
    if(d.rounds[0].length !== TEAMS.length) return;   // 팀 수가 바뀌었으면 버린다
    rounds = d.rounds;
    cur = Math.min(d.cur || 0, rounds.length - 1);
    history = Array.isArray(d.history) ? d.history : [];
    if(Array.isArray(d.vals) && d.vals.length === 3) vals = d.vals;
    if(d.view === "round" || d.view === "total") view = d.view;
  }catch(e){}
}

/* ──────────── 계산 ──────────── */
const total = t => rounds.reduce((s, r) => s + (r[t] || 0), 0);
// 지금 화면에 띄우는 값 — 보기 모드에 따라 갈린다
const shown = t => view === "total" ? total(t) : (rounds[cur][t] || 0);

function ranking(fn){
  const f = fn || total;
  return TEAMS
    .map((name, t) => ({name, t, pt: f(t)}))
    .sort((a, b) => b.pt - a.pt || a.t - b.t);
}
function rankOf(fn){
  // 동점은 같은 순위로 묶는다
  const sorted = ranking(fn);
  const map = {};
  let place = 0, prev = null;
  sorted.forEach((row, i) => {
    if(row.pt !== prev){ place = i + 1; prev = row.pt; }
    map[row.t] = place;
  });
  return map;
}
const ordinal = n => n + (["th","st","nd","rd"][(n % 100 - 20) % 10] || ["th","st","nd","rd"][n % 100] || "th");

/* ──────────── 그리기 ──────────── */
const board = document.getElementById("board");
TEAMS.forEach((name, t) => {
  const el = document.createElement("div");
  el.className = "slot";
  el.dataset.t = t;
  el.style.setProperty("--team", TEAM_COLORS[t] || "var(--mute)");
  el.innerHTML =
    '<span class="ord"></span>' +
    '<span class="tid"></span>' +
    '<span class="score">0</span>' +
    '<span class="vlabel"></span>' +
    '<div class="rounds"></div>' +
    '<div class="ctl">' +
      '<button class="minus" data-i="0"></button>' +
      '<button data-i="0"></button>' +
      '<button data-i="1"></button>' +
      '<button data-i="2"></button>' +
    '</div>';
  el.querySelector(".tid").textContent = name;
  board.appendChild(el);
});
const slots = [...board.children];

function render(bumped){
  const places = rankOf(shown);
  const top = Math.max(...TEAMS.map((_, t) => shown(t)));
  const anyScore = TEAMS.some((_, t) => shown(t) !== 0);

  slots.forEach((el, t) => {
    const pt = shown(t);
    const lead = anyScore && pt === top;
    if(lead !== el.classList.contains("lead")) el.classList.remove("pop");
    el.classList.toggle("lead", lead);
    el.querySelector(".ord").textContent = anyScore ? ordinal(places[t]) : "";
    const s = el.querySelector(".score");
    s.textContent = pt;
    if(bumped === t){
      s.classList.remove("bump");
      void s.offsetWidth;          // 연속 입력에도 애니메이션이 다시 걸리도록
      s.classList.add("bump");
    }
    el.querySelectorAll(".ctl button").forEach(b => {
      const v = vals[+b.dataset.i];
      const minus = b.classList.contains("minus");
      b.textContent = (minus ? "\u2212" : "+") + v;
      b.setAttribute("aria-label", TEAMS[t] + (minus ? " 감점 " : " 가점 ") + v);
    });
    el.querySelector(".vlabel").textContent =
      view === "total" ? "합계" : "Round " + (cur + 1);
    const box = el.querySelector(".rounds");
    box.innerHTML = "";
    rounds.forEach((r, i) => {
      const c = document.createElement("span");
      c.className = "chip" + (i === cur ? " now" : "");
      c.textContent = "R" + (i + 1) + " " + r[t];
      box.appendChild(c);
    });
  });

  document.getElementById("rNow").textContent = cur + 1;
  document.getElementById("rPrev").disabled = cur === 0;
  document.getElementById("undo").disabled = history.length === 0;
  const head = "Round " + (cur + 1) + " / " + rounds.length +
               " · 보기 " + (view === "total" ? "합계" : "이번 라운드");
  document.getElementById("status").textContent = SHEET
    ? head + " · T 보기전환"
    : head + " · 1–6 키 " + vals[0] + "점 · Shift+1–6 감점 · Z 되돌리기 · R 다음 라운드 · T 보기전환 · E 입력";
}

/* ──────────── 점수 ──────────── */
function add(t, d){
  if(!d) return;
  rounds[cur][t] += d;
  history.push({r: cur, t, d});
  beep(d > 0);
  render(t);
  save();
  if(net !== "local") sendOp({op: "add", t, d}, t);
}
function undo(){
  const last = history.pop();
  if(!last) return;
  rounds[last.r][last.t] -= last.d;
  render(last.t);
  save();
  if(net !== "local") sendOp({op: "undo"}, last.t);
}

/* ──────────── 라운드 ──────────── */
function goRound(n){
  if(n < 0) return;
  while(rounds.length <= n) rounds.push(TEAMS.map(() => 0));
  cur = n;
  render();
  save();
  if(net !== "local") sendOp({op: "round", n});
}

/* ──────────── 사운드 (라이브러리 없이 WebAudio) ──────────── */
let ac = null;
function ctx(){
  if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if(ac.state === "suspended") ac.resume();   // 모바일은 제스처 후에야 열린다
  return ac;
}
function tone(freq, dur, at, type, vol){
  const c = ctx(), o = c.createOscillator(), g = c.createGain();
  o.type = type || "triangle";
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, c.currentTime + at);
  g.gain.linearRampToValueAtTime(vol == null ? .18 : vol, c.currentTime + at + .012);
  g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + at + dur);
  o.connect(g).connect(c.destination);
  o.start(c.currentTime + at);
  o.stop(c.currentTime + at + dur + .02);
}
function beep(up){
  if(!sound) return;
  tone(up ? 880 : 320, .1, 0, "triangle", .14);
}
function fanfare(){
  if(!sound) return;
  [523, 659, 784, 1047].forEach((f, i) => tone(f, .5, i * .11, "triangle", .2));
}

/* ──────────── 결과 ──────────── */
const result = document.getElementById("result");
function finish(){
  const list = document.getElementById("rank");
  list.innerHTML = "";
  const places = rankOf();
  ranking().forEach((row, i) => {
    const li = document.createElement("li");
    li.style.animationDelay = (i * .07) + "s";
    li.innerHTML =
      '<span class="n">' + ordinal(places[row.t]) + '</span>' +
      '<span class="t"></span>' +
      '<span class="pt">' + row.pt + '</span>';
    li.querySelector(".t").textContent = row.name;
    list.appendChild(li);
  });
  result.hidden = false;
  const f = document.getElementById("flash");
  f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  fanfare();
}

/* ──────────── 조작 ──────────── */
board.addEventListener("click", e => {
  const b = e.target.closest(".ctl button");
  if(!b) return;
  const v = vals[+b.dataset.i];
  add(+b.closest(".slot").dataset.t, b.classList.contains("minus") ? -v : v);
});
const vins = [...document.querySelectorAll(".vin")];
vins.forEach(inp => inp.addEventListener("input", () => {
  vals[+inp.dataset.i] = Math.max(1, parseInt(inp.value, 10) || 1);
  render();
  save();
  if(net !== "local") sendOp({op: "vals", vals: vals.slice()});
}));
document.getElementById("rPrev").addEventListener("click", () => goRound(cur - 1));
document.getElementById("rNext").addEventListener("click", () => goRound(cur + 1));
document.getElementById("undo").addEventListener("click", undo);
document.getElementById("reset").addEventListener("click", () => {
  if(!confirm("점수를 전부 지우고 1라운드부터 다시 시작합니다.")) return;
  rounds = [TEAMS.map(() => 0)];
  cur = 0; history = [];
  render(); save();
  if(net !== "local") sendOp({op: "reset"});
});
document.getElementById("finish").addEventListener("click", finish);
document.getElementById("close").addEventListener("click", () => { result.hidden = true; });

function setView(v){
  view = v;
  document.getElementById("vRound").setAttribute("aria-pressed", v === "round");
  document.getElementById("vTotal").setAttribute("aria-pressed", v === "total");
  render();
  save();
}
document.getElementById("vRound").addEventListener("click", () => setView("round"));
document.getElementById("vTotal").addEventListener("click", () => setView("total"));

const editBtn = document.getElementById("editBtn");
editBtn.addEventListener("click", () => {
  const on = !document.body.classList.contains("editing");
  document.body.classList.toggle("editing", on);
  editBtn.setAttribute("aria-pressed", on);
});
const soundBtn = document.getElementById("soundBtn");
soundBtn.addEventListener("click", () => {
  sound = !sound;
  soundBtn.setAttribute("aria-pressed", sound);
  if(sound) beep(true);
});

document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  // Cmd+R 새로고침, Cmd+Z 실행취소 같은 브라우저 단축키는 건드리지 않는다
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === "Escape"){ result.hidden = true; return; }
  if(!result.hidden) return;
  if(SHEET){
    if(e.key.toLowerCase() === "t") setView(view === "total" ? "round" : "total");
    return;
  }
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= TEAMS.length){ add(n - 1, e.shiftKey ? -vals[0] : vals[0]); e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  if(k === "z"){ undo(); }
  else if(k === "r"){ goRound(cur + 1); }
  else if(k === "t"){ setView(view === "total" ? "round" : "total"); }
  else if(k === "e"){ editBtn.click(); }
  else if(k === "m"){ soundBtn.click(); }
});

/* ──────────── 시작 ──────────── */
load();
document.body.classList.add("editing");
vins.forEach(inp => { inp.value = vals[+inp.dataset.i]; });
setView(view);

/* 시트가 지정돼 있으면 시트가 정본. 아니면 서버, 그것도 없으면 이 브라우저. */
(async function connect(){
  if(SHEET){
    document.body.classList.add("readonly");
    document.body.classList.remove("editing");
    sheetPoll();
    return;
  }
  try{
    const r = await fetch("state", {cache: "no-store"});
    const s = await r.json();
    if(!Array.isArray(s.rounds) || !s.rounds.length) throw new Error("not our server");
    ver = s.v;
    applyState(s);
    setNet("server");
    poll();
  }catch(e){
    setNet("local");
  }
})();

// self-check: 주소 끝에 #test — 임의 점수를 채워 배치를 본다
if(location.hash === "#test"){
  rounds = [0,1,2].map(() => TEAMS.map(() => Math.floor(Math.random() * 40)));
  cur = 2;
  render();
}
</script>
